name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install development checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q cul868_flasher/app tests
      - name: Lint
        run: ruff check .
      - name: Run unit tests
        run: PYTHONPATH=cul868_flasher python -m unittest discover -s tests -t . -v
      - name: Check whitespace
        run: git diff --check
      - name: Build the add-on image
        run: docker build --pull --tag cul868-flasher-ci cul868_flasher
