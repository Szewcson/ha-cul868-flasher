name: CUL868 Firmware Flasher
version: 0.1.7
slug: cul868_flasher
description: Manually flash CUL868 V3 firmware through its USB DFU bootloader
stage: experimental
url: https://github.com/Szewcson/ha-cul868-flasher
arch:
  - aarch64
  - amd64
startup: services
init: false
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
# Uploads are bounded and Home Assistant Ingress is request/response based.
ingress_stream: false
panel_icon: mdi:radio-tower
panel_title: CUL868 Flasher
panel_admin: true
apparmor: true
# The normal CUL firmware is a CDC ACM device. dfu-programmer needs raw USB
# access only while the same device is in its Atmel-compatible DFU personality.
uart: true
usb: true
udev: true
tmpfs: true
options:
  device: null
  baudrate: "9600"
  boot_timeout: 90
  qemu_usb_reenumeration_workaround: false
schema:
  # Do not use device(subsystem=tty): Supervisor validates that the normal
  # endpoint exists before launch, but it intentionally disappears in DFU.
  # The app validates this as a bounded /dev path and only flashes a DFU
  # target at its previously verified physical USB topology, or at one
  # unpaired bootloader only after an explicit Ingress confirmation.
  device: str
  baudrate: list(9600|19200|38400|57600|115200)
  boot_timeout: int(15,120)
  # Adds a settle window and permits an exact-one fallback when QEMU moves the
  # verified CUL to a different guest USB topology during re-enumeration.
  qemu_usb_reenumeration_workaround: bool
